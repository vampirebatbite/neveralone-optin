<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeverAlone — Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #FAF8F5;
  --surface: #FFFEFB;
  --navy: #2C2420;
  --brown: #A67C52;
  --brown-dark: #8C6A45;
  --brown-light: #F2EBE1;
  --brown-lighter: #EDE6DC;
  --muted: #7A6E68;
  --border: #E2D9CE;
  --accent: #C49A6C;
  --green: #6B8F71;
  --red: #8B3A3A;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--navy);
  font-size: 16px;
  line-height: 1.7;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  background: rgba(44,36,32,0.97);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
  height: 56px;
}

.nav-logo {
  font-family: 'Lora', serif;
  font-size: 22px;
  color: #fff;
  letter-spacing: -0.5px;
}
.nav-logo span { color: var(--accent); }

.nav-links {
  display: flex;
  gap: 28px;
  list-style: none;
}
.nav-links a {
  color: rgba(255,255,255,0.5);
  text-decoration: none;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: color 0.2s;
}
.nav-links a:hover { color: #fff; }

.nav-hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  padding: 4px;
  background: none;
  border: none;
}
.nav-hamburger span {
  display: block;
  width: 22px;
  height: 2px;
  background: rgba(255,255,255,0.7);
  border-radius: 2px;
  transition: all 0.25s;
}
.nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-hamburger.open span:nth-child(2) { opacity: 0; }
.nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

.nav-dropdown {
  display: none;
  position: fixed;
  top: 56px;
  left: 0; right: 0;
  background: rgba(44,36,32,0.98);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  z-index: 99;
  padding: 12px 0;
}
.nav-dropdown.open { display: block; }
.nav-dropdown li {
  list-style: none;
}
.nav-dropdown a {
  display: block;
  padding: 14px 24px;
  color: rgba(255,255,255,0.6);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  transition: color 0.2s, background 0.2s;
}
.nav-dropdown a:hover { color: #fff; background: rgba(255,255,255,0.04); }
.nav-dropdown li:last-child a { border-bottom: none; }

/* ── HERO ── */
.hero {
  min-height: 100vh;
  background: var(--navy);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 100px 40px 80px;
  position: relative;
  overflow: hidden;
  text-align: center;
}

.hero::before {
  content: '';
  position: absolute;
  width: 800px; height: 800px;
  background: radial-gradient(circle, rgba(196,154,108,0.08) 0%, transparent 70%);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(196,154,108,0.1) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
}

.hero-eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 36px;
  position: relative;
  z-index: 1;
}

.hero-image-wrap {
  width: 100%;
  max-width: 680px;
  margin-bottom: 52px;
  position: relative;
  z-index: 1;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 32px 80px rgba(0,0,0,0.45);
}

.hero-img {
  width: 100%;
  height: auto;
  display: block;
}

.hero-title {
  font-family: 'Lora', serif;
  font-size: clamp(48px, 7vw, 84px);
  font-weight: 400;
  color: #fff;
  line-height: 1.0;
  letter-spacing: -1px;
  margin-bottom: 20px;
  position: relative;
  z-index: 1;
}
.hero-title em { font-style: normal; color: var(--accent); }

.hero-tagline {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 32px;
  position: relative;
  z-index: 1;
}

.hero-sub {
  font-size: 19px;
  color: rgba(255,255,255,0.55);
  max-width: 480px;
  line-height: 1.6;
  margin-bottom: 0;
  font-weight: 300;
  position: relative;
  z-index: 1;
}


/* ── MAIN ── */
.main { max-width: 880px; margin: 0 auto; padding: 0 40px 120px; }

/* ── SECTIONS ── */
.section {
  padding: 80px 0 20px;
  border-top: 1px solid var(--border);
  position: relative;
}
.section:first-of-type { border-top: none; }

.eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--brown-dark);
  margin-bottom: 16px;
  display: inline-block;
  background: var(--brown-light);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 5px 14px;
}

.section-title {
  font-family: 'Lora', serif;
  font-size: clamp(30px, 4vw, 46px);
  line-height: 1.1;
  letter-spacing: -0.5px;
  margin-bottom: 24px;
  color: var(--navy);
}

.section-lead {
  font-size: 18px;
  color: var(--muted);
  line-height: 1.7;
  max-width: 660px;
  margin-bottom: 48px;
  font-weight: 300;
}

/* ── CALLOUT ── */
.callout {
  background: var(--brown-light);
  border-left: 4px solid var(--brown-dark);
  border-radius: 0 12px 12px 0;
  padding: 22px 28px;
  margin: 32px 0;
  font-size: 16px;
  color: var(--navy);
  line-height: 1.65;
}
.callout strong { color: var(--brown-dark); font-weight: 600; }

/* ── DARK CALLOUT ── */
.callout-dark {
  background: var(--navy);
  border-radius: 12px;
  padding: 28px 32px;
  margin: 32px 0;
  color: rgba(255,255,255,0.75);
  line-height: 1.65;
  font-size: 15px;
}
.callout-dark strong { color: #fff; }
.callout-dark .big { font-family: 'Lora', serif; font-size: 24px; color: var(--accent); line-height: 1.3; display: block; margin-bottom: 10px; }

/* ── STAT CARDS ── */
.stat-row {
  display: grid;
  gap: 16px;
  margin: 40px 0;
}
.stat-row-3 { grid-template-columns: repeat(3, 1fr); }
.stat-row-4 { grid-template-columns: repeat(4, 1fr); }

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px 24px;
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--brown);
}
.stat-card.green::before { background: var(--green); }
.stat-card.accent::before { background: var(--accent); }

.stat-value {
  font-family: 'Lora', serif;
  font-size: 38px;
  line-height: 1;
  color: var(--navy);
  margin-bottom: 8px;
}
.stat-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 4px;
}
.stat-sub { font-size: 12px; color: var(--muted); }

/* ── TWO COL ── */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin: 40px 0; }
.col-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--brown);
  margin-bottom: 18px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--brown-lighter);
}

/* ── BULLET LIST ── */
.dot-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.dot-list li {
  padding-left: 20px;
  position: relative;
  font-size: 15px;
  line-height: 1.55;
  color: #3D3530;
}
.dot-list li::before {
  content: '•';
  position: absolute;
  left: 0;
  color: var(--brown);
  font-weight: 700;
}
.dot-list li strong { color: var(--navy); font-weight: 600; }

/* ── COMPETITOR TABLE ── */
.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 32px 0;
  font-size: 14px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.data-table thead tr { background: var(--navy); color: #fff; }
.data-table thead th {
  padding: 14px 18px;
  text-align: left;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.data-table tbody tr { border-bottom: 1px solid var(--border); }
.data-table tbody tr:last-child { border-bottom: none; }
.data-table tbody tr:nth-child(even) { background: #FAF6F2; }
.data-table td { padding: 14px 18px; color: var(--navy); vertical-align: middle; }
.data-table tr.highlight { background: var(--brown-light); font-weight: 600; }
.data-table td.center { text-align: center; }

.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 20px;
}
.badge-green { background: #E4EDE5; color: #3A5C3E; }
.badge-red { background: #EDE0DC; color: #6B3030; }
.badge-brown { background: var(--brown-light); color: var(--brown-dark); }

/* ── PRICING CARDS ── */
.pricing-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 40px 0;
}
.pricing-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 28px 24px;
  position: relative;
}
.pricing-card.featured {
  border-color: var(--brown);
  background: var(--brown-light);
}
.pricing-tag {
  display: none;
  position: absolute;
  top: -12px; left: 50%;
  transform: translateX(-50%);
  background: var(--brown);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 4px 12px;
  border-radius: 20px;
}
.pricing-card.featured .pricing-tag { display: block; }
.pricing-tier { font-size: 14px; font-weight: 700; color: var(--brown-dark); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.pricing-hw { font-family: 'Lora', serif; font-size: 36px; color: var(--navy); margin-bottom: 2px; }
.pricing-hw-label { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.pricing-sub { font-size: 18px; color: var(--brown-dark); font-weight: 700; margin-bottom: 6px; }
.pricing-sub-label { font-size: 12px; color: var(--muted); }

/* ── OPPORTUNITY NUMBERS ── */
.opp-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin: 40px 0;
}
.opp-card {
  border-radius: 14px;
  padding: 32px;
}
.opp-card.light {
  background: var(--surface);
  border: 1px solid var(--border);
}
.opp-card.dark {
  background: var(--navy);
}
.opp-card-label {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 20px;
}
.opp-card.light .opp-card-label { color: var(--muted); }
.opp-card.dark .opp-card-label { color: var(--accent); }
.opp-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 10px 0;
  border-bottom: 1px solid rgba(0,0,0,0.06);
  font-size: 14px;
}
.opp-card.dark .opp-row { border-bottom-color: rgba(255,255,255,0.06); }
.opp-row:last-child { border-bottom: none; }
.opp-metric { color: var(--muted); }
.opp-card.dark .opp-metric { color: rgba(255,255,255,0.5); }
.opp-num { font-weight: 700; color: var(--navy); }
.opp-card.dark .opp-num { color: #fff; }
.opp-big {
  font-family: 'Lora', serif;
  font-size: 42px;
  color: var(--accent);
  margin-top: 20px;
  line-height: 1;
}
.opp-big-label { font-size: 14px; color: rgba(255,255,255,0.5); margin-top: 6px; }

/* ── ARCH DIAGRAMS ── */
.arch-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin: 32px 0;
}
.arch-box {
  border-radius: 12px;
  padding: 24px;
  border: 1px solid var(--border);
}
.arch-box.good { background: var(--brown-light); border-color: var(--brown); }
.arch-box.bad { background: #F7F2EE; }
.arch-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.arch-label.good { color: var(--green); }
.arch-label.bad { color: var(--red); }
.arch-title { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 16px; }

/* ── FLOW DIAGRAM ── */
.flow-diagram { margin: 40px 0; overflow: visible; }

/* ── SOLUTION PHOTO ── */
.solution-photo {
  margin: 48px 0 0;
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 40px;
  align-items: center;
}
.solution-photo-img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 16px;
  border: 1px solid var(--border);
}
.solution-photo-caption-wrap {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.solution-photo-caption-wrap .eyebrow {
  margin-bottom: 0;
  background: transparent;
  border: none;
  padding: 0;
  border-radius: 0;
}
.solution-photo-caption-title {
  font-family: 'Lora', serif;
  font-size: 28px;
  line-height: 1.2;
  letter-spacing: -0.3px;
  color: var(--navy);
}
.solution-photo-caption {
  font-size: 15px;
  color: var(--muted);
  line-height: 1.7;
}
@media (max-width: 768px) {
  .solution-photo {
    grid-template-columns: 1fr;
  }
  .button-itself-grid {
    grid-template-columns: 1fr !important;
    text-align: center !important;
  }
  .button-itself-grid > div {
    text-align: center !important;
  }
}

/* ── WHY NOW ── */
.why-now-box {
  background: var(--navy);
  border-radius: 16px;
  padding: 48px;
  margin: 40px 0;
  color: rgba(255,255,255,0.75);
}
.why-now-box .eyebrow { color: var(--accent); background: rgba(196,154,108,0.15); border-color: rgba(196,154,108,0.3); }
.why-now-box .section-title { color: #fff; }
.why-now-box .dot-list li { color: rgba(255,255,255,0.65); }
.why-now-box .dot-list li::before { color: var(--accent); }
.why-now-box .dot-list li strong { color: #fff; }

/* ── FOOTER ── */
footer {
  background: var(--navy);
  color: rgba(255,255,255,0.35);
  text-align: center;
  padding: 48px 40px;
  font-size: 13px;
  line-height: 2;
}
footer strong {
  display: block;
  font-family: 'Lora', serif;
  font-size: 28px;
  color: #fff;
  margin-bottom: 8px;
}

/* ── RESPONSIVE ── */
@media (max-width: 1080px) {
  .nav-links { display: none; }
  .nav-hamburger { display: flex; }
}

@media (max-width: 768px) {
  nav { padding: 0 20px; }
  .hero { padding: 80px 24px 60px; }
  .hero-stats { flex-direction: column; gap: 20px; }
  .main { padding: 0 24px 80px; }
  .stat-row-3, .stat-row-4 { grid-template-columns: 1fr 1fr; }
  .two-col, .pricing-grid, .opp-grid, .arch-pair { grid-template-columns: 1fr; }
  .why-now-box { padding: 28px 24px; }
}

/* ── FADE IN ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>

<div id="password-gate" style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#FAF8F5; font-family:'Inter',sans-serif; padding:20px;">
  <div style="max-width:340px; width:100%; text-align:center;">
    <div style="font-family:'Lora',serif; font-size:22px; color:#2C2420; margin-bottom:16px;">This page is private</div>
    <input type="password" id="pw-input" placeholder="Enter password" style="width:100%; padding:12px 14px; border:1px solid #E2D9CE; border-radius:8px; font-size:15px; margin-bottom:12px; box-sizing:border-box;" />
    <button onclick="checkPassword()" style="width:100%; padding:12px 14px; background:#8C6A45; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer;">Enter</button>
    <div id="pw-error" style="color:#B23B3B; font-size:13px; margin-top:10px; display:none;">Incorrect password. Try again.</div>
  </div>
</div>
<div id="protected-content" style="display:none;"></div>


<script>

  function toggleMenu() {
    const btn = document.getElementById('hamburger');
    const menu = document.getElementById('nav-dropdown');
    btn.classList.toggle('open');
    menu.classList.toggle('open');
  }
  function navScrollTo(id) {
    document.getElementById(id).scrollIntoView({behavior:'smooth'});
    document.getElementById('hamburger').classList.remove('open');
    document.getElementById('nav-dropdown').classList.remove('open');
  }

const correctHash = "b445b4219656f4ae2dc2e39a127f4c8d5bf3fb71d2f756620b84135c33294ec3";

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPassword() {
  const input = document.getElementById('pw-input').value;
  const hash = await sha256(input);
  if (hash === correctHash) {
    document.getElementById('password-gate').style.display = 'none';
    const decoded = decodeURIComponent(escape(atob(encodedContent)));
    const container = document.getElementById('protected-content');
    container.innerHTML = decoded;
    container.style.display = 'block';
    sessionStorage.setItem('na_auth', '1');
  } else {
    document.getElementById('pw-error').style.display = 'block';
  }
}

document.getElementById('pw-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPassword();
});

if (sessionStorage.getItem('na_auth') === '1') {
  window.addEventListener('DOMContentLoaded', async function() {
    document.getElementById('password-gate').style.display = 'none';
    const decoded = decodeURIComponent(escape(atob(encodedContent)));
    const container = document.getElementById('protected-content');
    container.innerHTML = decoded;
    container.style.display = 'block';
  });
}
</script>
